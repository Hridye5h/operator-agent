<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator — run viewer</title>
<style>
  :root{
    --ink:#10151c; --mut:#5d6b7a; --line:#dde4ec; --bg:#f5f8fb; --card:#fff;
    --accent:#0b3d63; --ok:#1c6b32; --okbg:#e8f6ec; --bad:#8a1f1f; --badbg:#fdeaea;
    --warn:#8a5a00; --warnbg:#fdf3e0; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --ink:#e6edf5; --mut:#93a4b6; --line:#243244; --bg:#0d1218; --card:#141b24;
    --accent:#7fb7e6; --ok:#7fd79a; --okbg:#14301d; --bad:#f0a3a3; --badbg:#36181a;
    --warn:#e8c477; --warnbg:#332814;
  }}
  :root[data-theme=dark]{
    --ink:#e6edf5; --mut:#93a4b6; --line:#243244; --bg:#0d1218; --card:#141b24;
    --accent:#7fb7e6; --ok:#7fd79a; --okbg:#14301d; --bad:#f0a3a3; --badbg:#36181a;
    --warn:#e8c477; --warnbg:#332814;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:30px 16px 18px;text-align:center;border-bottom:1px solid var(--line);
         background:var(--card)}
  h1{margin:0 0 6px;font-size:25px;letter-spacing:-.3px}
  header p{margin:0 auto;max-width:680px;color:var(--mut);font-size:14px}
  header a{color:var(--accent)}
  main{max-width:1000px;margin:0 auto;padding:22px 16px 70px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tabs button{flex:1 1 200px;background:var(--card);color:var(--ink);cursor:pointer;
      border:1px solid var(--line);border-radius:9px;padding:11px 13px;font:inherit;text-align:left}
  .tabs button:hover{border-color:var(--accent)}
  .tabs button[aria-selected=true]{border-color:var(--accent);
      box-shadow:inset 0 0 0 1px var(--accent)}
  .tabs b{display:block;font-size:14px}
  .tabs span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .pill{border:1px solid var(--line);background:var(--card);border-radius:999px;
        padding:6px 13px;font-size:13px}
  .pill.ok{background:var(--okbg);border-color:transparent;color:var(--ok);font-weight:600}
  .pill.bad{background:var(--badbg);border-color:transparent;color:var(--bad);font-weight:600}
  .goal{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:8px;padding:13px 15px;margin-bottom:20px;font-size:14.5px}
  ol.steps{list-style:none;margin:0;padding:0}
  li.step{display:grid;grid-template-columns:34px 92px 1fr;gap:12px;align-items:start;
          background:var(--card);border:1px solid var(--line);border-radius:9px;
          padding:11px 13px;margin-bottom:8px}
  .idx{color:var(--mut);font:12px var(--mono);padding-top:3px}
  .kind{font:11px var(--mono);text-transform:uppercase;letter-spacing:.5px;
        padding:3px 7px;border-radius:5px;text-align:center;background:var(--bg);
        border:1px solid var(--line);color:var(--mut)}
  .k-tool_call .kind{background:var(--accent);border-color:transparent;color:#fff}
  .k-verification .kind,.k-complete .kind{background:var(--okbg);border-color:transparent;color:var(--ok)}
  .k-error .kind,.k-escalation .kind{background:var(--badbg);border-color:transparent;color:var(--bad)}
  .k-decision .kind{background:var(--warnbg);border-color:transparent;color:var(--warn)}
  .body{min-width:0}
  .text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
  .step.mono .text{font:12.5px/1.55 var(--mono)}
  .meta{color:var(--mut);font-size:12px;margin-top:4px}
  .fail{color:var(--bad);font-weight:600}
  .shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .shots a{display:block;border:1px solid var(--line);border-radius:7px;overflow:hidden;
           width:188px;text-decoration:none}
  .shots img{display:block;width:100%;height:112px;object-fit:cover;object-position:top}
  .shots span{display:block;padding:5px 7px;font:11px var(--mono);color:var(--mut);
              background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 40px}
  footer a{color:var(--accent)}
  .toggle{position:fixed;top:12px;right:12px;background:var(--card);color:var(--ink);
          border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font:inherit}
  @media (max-width:640px){
    li.step{grid-template-columns:28px 1fr;gap:8px}
    .kind{grid-column:2;justify-self:start;margin-bottom:2px}
    .body{grid-column:2}
    .shots a{width:100%}
  }
</style>
</head>
<body>
<button class="toggle" id="theme">dark / light</button>

<header>
  <h1>Operator — run viewer</h1>
  <p>Real recorded runs of an autonomous agent: it plans its own steps, drives a browser
     against a system with no API, recovers from failures, asks a human when it cannot decide
     safely, and verifies the outcome by reading it back before reporting success.
     <a href="https://github.com/Hridye5h/operator-agent">Source on GitHub</a></p>
</header>

<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="summary" id="summary"></div>
  <div class="goal" id="goal"></div>
  <ol class="steps" id="steps"></ol>
</main>

<footer id="foot"></footer>

<script>
const RUNS = [
  {id:"happy", name:"Autonomous completion",
   blurb:"Reads the latest invoice, records it, recovers from a system outage, verifies."},
  {id:"ambiguous", name:"Refuses to guess",
   blurb:"The invoice states two different totals, so the agent escalates to a human."},
  {id:"high_value", name:"Needs approval",
   blurb:"The payable is over the limit, so sign-off is required before anything is written."},
];

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function renderTabs(active){
  $("tabs").innerHTML = RUNS.map(r =>
    `<button role="tab" data-id="${r.id}" aria-selected="${r.id===active}">
       <b>${esc(r.name)}</b><span>${esc(r.blurb)}</span></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => load(b.dataset.id));
}

function pill(label, value, cls=""){
  return `<span class="pill ${cls}">${esc(label)}: <b>${esc(value)}</b></span>`;
}

async function load(id){
  renderTabs(id);
  const run = RUNS.find(r => r.id === id);
  $("steps").innerHTML = `<li class="step"><div class="idx"></div><div class="kind">…</div>
                          <div class="body"><div class="text">Loading run…</div></div></li>`;
  let t;
  try{
    const res = await fetch(`demo/runs/${id}/trace.json`, {cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    t = await res.json();
  }catch(err){
    $("summary").innerHTML = "";
    $("goal").textContent = "";
    $("steps").innerHTML = `<li class="step"><div class="idx"></div>
      <div class="kind">error</div><div class="body"><div class="text fail">
      Could not load this run (${esc(err.message)}).</div></div></li>`;
    return;
  }

  const good = t.outcome === "completed";
  $("summary").innerHTML = [
    pill("outcome", t.outcome || "incomplete", good ? "ok" : "bad"),
    pill("steps", t.step_count),
    pill("duration", t.duration_s + "s"),
    pill("run", t.run_id),
  ].join("");
  $("goal").innerHTML = `<b>Goal</b> — ${esc(t.goal)}`;

  $("steps").innerHTML = t.steps.map(s => {
    const failed = s.detail && s.detail.ok === false;
    const mono = s.kind === "tool_call" || s.kind === "observation";
    const shots = (s.artifacts || []).map(a => {
      const src = `demo/runs/${id}/artifacts/${a}`;
      return `<a href="${src}" target="_blank" rel="noopener">
                <img src="${src}" alt="${esc(a)}" loading="lazy"><span>${esc(a)}</span></a>`;
    }).join("");
    const bits = [];
    if(s.elapsed_ms != null) bits.push(s.elapsed_ms + " ms");
    if(s.detail && s.detail.retriable) bits.push("retriable");
    if(s.detail && s.detail.confidence != null) bits.push("confidence " + s.detail.confidence);
    return `<li class="step k-${esc(s.kind)}${mono ? " mono" : ""}">
      <div class="idx">${s.index}</div>
      <div class="kind">${esc(s.kind)}</div>
      <div class="body">
        <div class="text${failed ? " fail" : ""}">${esc(s.summary)}</div>
        ${bits.length ? `<div class="meta">${esc(bits.join(" · "))}</div>` : ""}
        ${shots ? `<div class="shots">${shots}</div>` : ""}
      </div></li>`;
  }).join("");

  $("foot").innerHTML =
    `Every step above was recorded at runtime, including the failures. ` +
    `Screenshots are what the agent's browser actually showed. ` +
    `<a href="https://github.com/Hridye5h/operator-agent">Read the code</a> · ` +
    `<a href="https://github.com/Hridye5h/operator-agent/blob/main/docs/ARCHITECTURE.md">Architecture</a> · ` +
    `<a href="https://github.com/Hridye5h/operator-agent/blob/main/docs/DECISIONS.md">Design decisions</a>`;
}

$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("op-theme", next); }catch(e){}
};
try{
  const saved = localStorage.getItem("op-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(e){}

load("happy");
</script>
</body>
</html>
