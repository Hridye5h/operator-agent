<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meridian AP{% endblock %}</title>
  <style>
    :root { --ink:#17202a; --mut:#5b6b7c; --line:#d8e0e8; --bg:#f4f7fa; --accent:#0b3d63; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
           color:var(--ink); background:var(--bg); }
    header { background:var(--accent); color:#fff; padding:14px 24px; }
    header b { font-size:17px; letter-spacing:.3px; }
    header span { opacity:.75; margin-left:10px; font-size:13px; }
    nav { background:#fff; border-bottom:1px solid var(--line); padding:0 24px; }
    nav a { display:inline-block; padding:12px 16px; color:var(--mut);
            text-decoration:none; border-bottom:2px solid transparent; }
    nav a:hover { color:var(--accent); border-bottom-color:var(--accent); }
    main { max-width:900px; margin:28px auto; padding:0 24px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:22px; }
    h1 { font-size:20px; margin:0 0 18px; }
    label { display:block; margin:14px 0 5px; font-weight:600; font-size:13px; }
    input[type=text] { width:100%; padding:9px 11px; border:1px solid var(--line);
                       border-radius:6px; font-size:15px; font-family:inherit; }
    button { margin-top:20px; background:var(--accent); color:#fff; border:0;
             padding:11px 22px; border-radius:6px; font-size:15px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
    .error { background:#fdeaea; border:1px solid #f0b3b3; color:#8a1f1f;
             padding:11px 14px; border-radius:6px; margin-bottom:6px; font-size:14px; }
    .ok { background:#e8f6ec; border:1px solid #a9ddb8; color:#1c6b32;
          padding:11px 14px; border-radius:6px; font-size:14px; }
    .muted { color:var(--mut); font-size:13px; }
    code { background:#eef2f6; padding:1px 5px; border-radius:3px; font-size:13px; }
  </style>
</head>
<body>
  <header><b>Meridian Systems</b><span>Accounts Payable</span></header>
  <nav><a href="/">Payables</a><a href="/new">Record payable</a><a href="/vendors">Vendors</a><a href="/vendors/new">Register vendor</a></nav>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
